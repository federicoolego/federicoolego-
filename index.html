<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Federico Olego · Proyectos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --panel-2: #1c2230;
      --border: #2a313c; --text: #e6edf3; --muted: #8b949e;
      --accent: #4ade80; --shadow: rgba(0,0,0,0.45);
    }
    [data-theme="light"] {
      --bg: #f4f6fa; --panel: #ffffff; --panel-2: #eef1f6;
      --border: #d8dee6; --text: #1a1f28; --muted: #5b6674;
      --accent: #16a34a; --shadow: rgba(20,30,50,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg); color: var(--text);
      font-family: "Inter", system-ui, sans-serif; line-height: 1.5;
      min-height: 100vh; transition: background .25s, color .25s;
      background-image: radial-gradient(circle at 15% -10%, rgba(74,222,128,0.08), transparent 42%);
    }

    .wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px 64px; }

    /* ---------- Header ---------- */
    header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 20px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .eyebrow {
      font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--accent); font-weight: 600;
    }
    h1 {
      font-family: "Barlow Condensed", sans-serif; font-weight: 700;
      font-size: 52px; line-height: 0.98; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .sub { color: var(--muted); font-size: 15px; margin-top: 6px; }

    .theme-toggle {
      background: var(--panel); border: 1px solid var(--border);
      color: var(--text); border-radius: 999px; width: 44px; height: 44px;
      font-size: 20px; cursor: pointer; display: grid; place-items: center;
      transition: border-color .2s, transform .2s; flex: 0 0 auto;
    }
    .theme-toggle:hover { border-color: var(--accent); transform: translateY(-2px); }

    /* ---------- Selector de agrupación ---------- */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 36px;
    }
    .group-switch {
      display: inline-flex; background: var(--panel); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px;
    }
    .toggle-all {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--panel); border: 1px solid var(--border); color: var(--muted);
      font: 600 13px "Inter", sans-serif; padding: 10px 16px; border-radius: 999px;
      cursor: pointer; transition: border-color .2s, color .2s;
    }
    .toggle-all:hover { border-color: var(--accent); color: var(--text); }
    .toggle-all:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .toggle-all .ico { font-size: 14px; line-height: 1; transition: transform .3s; }
    .toggle-all[aria-expanded="true"] .ico { transform: rotate(180deg); }
    .group-switch button {
      background: none; border: 0; color: var(--muted); cursor: pointer;
      font: 600 13px "Inter", sans-serif; padding: 8px 16px; border-radius: 999px;
      transition: background .2s, color .2s;
    }
    .group-switch button[aria-pressed="true"] { background: var(--accent); color: #0d1117; }
    .group-switch button:not([aria-pressed="true"]):hover { color: var(--text); }

    /* ---------- Secciones (acordeón) ---------- */
    .section + .section { margin-top: 10px; }

    .section-head {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 10px 0; background: none; border: 0;
      border-bottom: 1px solid var(--border);
      color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    .section-head:hover h2 { color: var(--accent); }
    .section-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }

    .section-head .logo {
      width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto;
      display: grid; place-items: center; font-size: 22px;
      background: var(--panel-2); overflow: hidden;
    }
    .section-head .logo img { width: 100%; height: 100%; object-fit: contain; }
    .section-head h2 {
      font-family: "Barlow Condensed", sans-serif; font-weight: 700;
      font-size: 26px; text-transform: uppercase; letter-spacing: .5px;
      transition: color .2s;
    }
    .section-head .count { margin-left: auto; color: var(--muted); font-size: 13px; }
    .section-head .chev {
      color: var(--muted); font-size: 18px; line-height: 1;
      transition: transform .3s, color .2s; transform: rotate(-90deg);
    }
    .section.open .chev { transform: rotate(0); color: var(--accent); }

    .panel {
      display: grid; grid-template-rows: 0fr;
      transition: grid-template-rows .35s ease;
    }
    .section.open .panel { grid-template-rows: 1fr; }
    /* margen negativo + padding en .grid = espacio para el hover/sombra sin que lo corte el overflow */
    .panel-inner { overflow: hidden; min-height: 0; margin: 0 -10px; }
    .panel-inner .grid { padding: 16px 10px 26px; }

    /* ---------- Tarjetas ---------- */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }

    .proj {
      display: flex; flex-direction: column; gap: 10px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 22px; text-decoration: none;
      color: inherit; position: relative; overflow: hidden;
      transition: transform .18s, border-color .18s, box-shadow .18s;
    }
    .proj::before {
      content: ""; position: absolute; top: 0; left: 0;
      width: 100%; height: 3px; background: var(--accent);
      transform: scaleX(0); transform-origin: left; transition: transform .25s;
    }
    .proj:hover, .proj:focus-visible {
      transform: translateY(-4px); border-color: var(--accent);
      box-shadow: 0 14px 34px var(--shadow); outline: none;
    }
    .proj:hover::before, .proj:focus-visible::before { transform: scaleX(1); }

    .proj .icon { width: 40px; height: 40px; font-size: 36px; line-height: 40px; }
    .proj .icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .proj h3 { font-size: 18px; font-weight: 600; line-height: 1.25; }
    .proj .tag {
      align-self: flex-start; font-size: 11px; font-weight: 600;
      color: var(--muted); background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px;
    }
    .proj p { color: var(--muted); font-size: 14px; flex: 1; }
    .proj .go {
      font-size: 13px; font-weight: 600; color: var(--accent);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .proj .go .arrow { transition: transform .2s; }
    .proj:hover .go .arrow { transform: translateX(4px); }

    footer {
      margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 13px; text-align: center;
    }

    @media (max-width: 640px) {
      .wrap { padding: 32px 16px 48px; }
      h1 { font-size: 40px; }
      .grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="eyebrow">Proyectos</div>
        <h1>Federico Olego</h1>
        <p class="sub">Colección de mis desarrollos y herramientas</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
    </header>

    <div class="toolbar">
      <div class="group-switch" role="group" aria-label="Agrupar proyectos">
        <button type="button" data-group="tipo" aria-pressed="true">Por tipo</button>
        <button type="button" data-group="complejo" aria-pressed="false">Por complejo</button>
      </div>
      <button type="button" class="toggle-all" id="toggle-all" aria-expanded="false">
        <span class="ico" aria-hidden="true">▾</span><span class="lbl">Expandir todo</span>
      </button>
    </div>

    <main id="projects"></main>

    <footer>Desarrollado por Federico Olego</footer>
  </div>

  <script>
    /* ============================================================
       DATOS — para sumar un proyecto, agregá una línea acá.
       hidden: true lo oculta sin borrarlo.
       ultimo: true en un grupo lo manda siempre al final del orden.
       ============================================================ */
    const BASE = "https://federicoolego.github.io/";

    const COMPLEJOS = {
      clasico:     { nombre: "El Clásico",  logo: BASE + "Torneos-Padel-ElClasico/favicon.png" },
      nodo:        { nombre: "NODO",        logo: BASE + "Torneos-Padel-Nodo/favicon.png" },
      defensores:  { nombre: "Defensores",  logo: BASE + "Reservas-Padel-Defensores/favicon.png" },
      complejopm:  { nombre: "Complejo PM", logo: BASE + "Generar-Torneo-Padel-ComplejoPM/favicon.png" },
      general:     { nombre: "Otras herramientas", emoji: "🧰", ultimo: true }
    };

    const TIPOS = {
      gestor:    { nombre: "Gestor de torneos",      emoji: "🏆", desc: "Zonas, cruces y resultados de cada fecha. Inscribí tu pareja, seguí tus partidos y mirá el cuadro en vivo." },
      generador: { nombre: "Generador de torneos",   emoji: "🏅", desc: "Imágenes de zonas y playoff listas para compartir por WhatsApp." },
      reservas:  { nombre: "Generador de reservas",  emoji: "📅", desc: "Imágenes de reservas listas para compartir por WhatsApp." },
      turno:     { nombre: "Turnos",                 emoji: "🎾", desc: "Tarjetas de confirmación de turno, listas para compartir por WhatsApp." },
      dashboard: { nombre: "Dashboards",             emoji: "📊" }
    };

    const PROYECTOS = [
      // { complejo: "clasico",    tipo: "gestor",    repo: "Torneos-Padel-ElClasico" },
      { complejo: "clasico",    tipo: "generador", repo: "Generar-Torneo-Padel-ElClasico" },
      { complejo: "clasico",    tipo: "reservas",  repo: "Reservas-Padel-ElClasico" },

      { complejo: "nodo",       tipo: "gestor",    repo: "Torneos-Padel-Nodo" },
      { complejo: "nodo",       tipo: "generador", repo: "Generar-Torneo-Padel-Nodo" },
      { complejo: "nodo",       tipo: "reservas",  repo: "Reservas-Padel-Nodo" },

      { complejo: "defensores", tipo: "generador", repo: "Generar-Torneo-Padel-Defensores" },
      { complejo: "defensores", tipo: "reservas",  repo: "Reservas-Padel-Defensores" },

      { complejo: "complejopm", tipo: "generador", repo: "Generar-Torneo-Padel-ComplejoPM" },
      { complejo: "complejopm", tipo: "reservas",  repo: "Reservas-Padel-ComplejoPM" },

      { complejo: "general",    tipo: "turno",     repo: "Turno-Padel", titulo: "Turno de Pádel", icon: "🎾" },
      { complejo: "general",    tipo: "dashboard", repo: "Estadisticas-Padel", titulo: "Estadísticas de Pádel", icon: "📊",
        desc: "Dashboard interactivo con KPIs, gráficos y filtros sobre el historial de mis partidos." },

      // Ocultos
      { complejo: "complejopm", tipo: "dashboard", repo: "Torneos-Padel-Inscripciones", titulo: "Circuito PM - Inscripciones", icon: "🏆",
        desc: "Dashboard para visualizar las parejas inscriptas en torneos organizados por Circuito PM.", hidden: true },
      { complejo: "general", tipo: "dashboard", repo: "finanzas-personales", titulo: "Finanzas Personales", icon: "💰",
        desc: "Registro y visualización de mis reservas financieras a lo largo del tiempo, en ARS y USD.", hidden: true }
    ];

    /* ============================================================
       RENDER
       ============================================================ */
    const $main = document.getElementById("projects");
    const SOLO_UNO = true;            // false = se pueden abrir varias secciones a la vez
    const KEY_GROUP = "group-v2";     // cambiar el sufijo resetea la vista guardada de todos

    function esc(s) {
      return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function iconHTML(p) {
      if (p.icon) return esc(p.icon);
      const c = COMPLEJOS[p.complejo];
      return `<img src="${BASE}${esc(p.repo)}/favicon.png" alt="${esc(c.nombre)}" loading="lazy"
                   onerror="this.replaceWith(document.createTextNode('${TIPOS[p.tipo].emoji}'))">`;
    }

    // Si agrupo por complejo, el título dice el tipo; si agrupo por tipo, dice el complejo.
    function tituloDe(p, agrupacion) {
      return p.titulo || (agrupacion === "complejo" ? TIPOS[p.tipo].nombre : COMPLEJOS[p.complejo].nombre);
    }

    function card(p, agrupacion) {
      const c = COMPLEJOS[p.complejo], t = TIPOS[p.tipo];
      const titulo = tituloDe(p, agrupacion);
      const tag = p.titulo ? "" : `<span class="tag">${esc(agrupacion === "complejo" ? c.nombre : t.nombre)}</span>`;
      return `
        <a class="proj" href="${BASE}${esc(p.repo)}/" target="_blank" rel="noopener">
          <div class="icon">${iconHTML(p)}</div>
          <h3>${esc(titulo)}</h3>
          ${tag}
          <p>${esc(p.desc || t.desc || "")}</p>
          <span class="go">Abrir <span class="arrow">→</span></span>
        </a>`;
    }

    // Orden: grupos "ultimo" al final; después más apps primero; empate por nombre ascendente.
    function ordenarGrupos(a, b) {
      return (a.grupo.ultimo ? 1 : 0) - (b.grupo.ultimo ? 1 : 0)
          || b.items.length - a.items.length
          || a.grupo.nombre.localeCompare(b.grupo.nombre, "es", { sensitivity: "base" });
    }

    function getAbiertos(agr) {
      try { return JSON.parse(localStorage.getItem("open-" + agr)); } catch (e) { return null; }
    }
    function saveAbiertos() {
      const keys = [...$main.querySelectorAll(".section.open")].map(s => s.dataset.key);
      try { localStorage.setItem("open-" + $main.dataset.agrupacion, JSON.stringify(keys)); } catch (e) {}
    }
    function setOpen(sec, v) {
      sec.classList.toggle("open", v);
      sec.querySelector(".section-head").setAttribute("aria-expanded", String(v));
      sec.querySelector(".panel").inert = !v;
    }

    function render(agrupacion) {
      const catalogo = agrupacion === "complejo" ? COMPLEJOS : TIPOS;
      const visibles = PROYECTOS.filter(p => !p.hidden);

      const grupos = Object.entries(catalogo)
        .map(([key, grupo]) => ({
          key, grupo,
          items: visibles
            .filter(p => p[agrupacion] === key)
            .sort((a, b) => tituloDe(a, agrupacion).localeCompare(tituloDe(b, agrupacion), "es", { sensitivity: "base" }))
        }))
        .filter(g => g.items.length)
        .sort(ordenarGrupos);

      let abiertos = getAbiertos(agrupacion);
      if (!Array.isArray(abiertos)) abiertos = grupos.length ? [grupos[0].key] : [];

      $main.dataset.agrupacion = agrupacion;
      $main.innerHTML = grupos.map(({ key, grupo, items }) => {
        const open = abiertos.includes(key);
        const logo = grupo.logo ? `<img src="${esc(grupo.logo)}" alt="">` : esc(grupo.emoji || "");
        const id = `panel-${agrupacion}-${key}`;
        return `
          <section class="section${open ? " open" : ""}" data-key="${esc(key)}">
            <button type="button" class="section-head" aria-expanded="${open}" aria-controls="${id}">
              <div class="logo">${logo}</div>
              <h2>${esc(grupo.nombre)}</h2>
              <span class="count">${items.length} ${items.length === 1 ? "app" : "apps"}</span>
              <span class="chev" aria-hidden="true">▾</span>
            </button>
            <div class="panel" id="${id}" ${open ? "" : "inert"}>
              <div class="panel-inner">
                <div class="grid">${items.map(p => card(p, agrupacion)).join("")}</div>
              </div>
            </div>
          </section>`;
      }).join("");

      document.querySelectorAll(".group-switch button").forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.group === agrupacion)));
      try { localStorage.setItem(KEY_GROUP, agrupacion); } catch (e) {}
      if (typeof syncToggleAll === "function") syncToggleAll();
    }

    // Botón expandir/colapsar todo: muestra "Colapsar" solo si están todas abiertas
    const $toggleAll = document.getElementById("toggle-all");
    function syncToggleAll() {
      const secs = $main.querySelectorAll(".section");
      const todas = secs.length > 0 && [...secs].every(s => s.classList.contains("open"));
      $toggleAll.setAttribute("aria-expanded", String(todas));
      $toggleAll.querySelector(".lbl").textContent = todas ? "Colapsar todo" : "Expandir todo";
    }
    $toggleAll.addEventListener("click", () => {
      const abrir = $toggleAll.getAttribute("aria-expanded") !== "true";
      $main.querySelectorAll(".section").forEach(s => setOpen(s, abrir));
      saveAbiertos();
      syncToggleAll();
    });

    // Delegación: un solo listener sobrevive a los re-render
    $main.addEventListener("click", e => {
      const head = e.target.closest(".section-head");
      if (!head) return;
      const sec = head.closest(".section");
      const abrir = !sec.classList.contains("open");
      // Modo acordeón: al abrir una, se cierran las demás; al cerrar, solo se cierra esa
      if (SOLO_UNO && abrir) $main.querySelectorAll(".section.open").forEach(s => setOpen(s, false));
      setOpen(sec, abrir);
      saveAbiertos();
      syncToggleAll();
    });

    document.querySelectorAll(".group-switch button").forEach(b =>
      b.addEventListener("click", () => render(b.dataset.group)));

    let inicial = "tipo";
    try { inicial = localStorage.getItem(KEY_GROUP) || "tipo"; } catch (e) {}
    render(inicial);

    /* ============================================================
       TEMA
       ============================================================ */
    (function () {
      const root = document.documentElement;
      const btn = document.getElementById("theme-toggle");
      try { const saved = localStorage.getItem("theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
      const sync = () => btn.textContent = root.getAttribute("data-theme") === "dark" ? "🌙" : "☀️";
      sync();
      btn.addEventListener("click", () => {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        sync();
      });
    })();
  </script>
</body>
</html>
